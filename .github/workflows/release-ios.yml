name: Release to TestFlight

# Same trigger as the Play workflow: one tag ships both stores. Copied from MoodTraker.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    # macos-26 and not macos-15: Compose links against UIKit classes that only exist from the
    # iOS 26 SDK on, so an older image fails the archive with undefined symbols.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The "Compile Kotlin Framework" run script phase shells out to ./gradlew, so the JDK has to
      # be on PATH before xcodebuild starts, not inside it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Until the Apple account exists this repository has no iOS secrets, and a job that fails on
      # every tag trains you to ignore the red mark next to the Android one that matters.
      - id: gate
        run: |
          if [ -n "${{ secrets.APPSTORE_KEY_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No App Store Connect secrets yet, skipping the iOS release."
          fi

      - name: Archive and upload
        if: steps.gate.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # An App Store Connect API key instead of an Apple ID: `-allowProvisioningUpdates` can
          # then create and download the certificate and the provisioning profile itself, so no
          # .p12 and no .mobileprovision ever have to live in a secret.
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"

          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID"
          )

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlowTime.xcarchive" \
            "${AUTH[@]}" \
            TEAM_ID="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

          # `destination: upload` hands the build straight to App Store Connect, which saves
          # exporting an ipa only to feed it to altool in the next step.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FlowTime.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"

      - name: Shred the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
