name: Tests

# Cheap gate, not a release: unit tests, lint and ktlint of every module, like the sister apps. The
# macOS job is the only thing that proves iosMain still compiles and links.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build

  ios:
    # macOS minutes bill ten to one, so this job stays on main and pull requests only, which is
    # what the `on:` block above already limits it to.
    #
    # macos-26 and not macos-15: Compose for iOS references UIKit classes that only exist from
    # the iOS 26 SDK on, so the older image links the tests with undefined symbols.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # The core/data test binary links Compose for iOS and RevenueCat; compiling shared compiles
      # every iosMain of the app.
      - run: ./gradlew :core:data:iosSimulatorArm64Test :shared:compileKotlinIosSimulatorArm64
