name: Release to Play

# Por etiqueta y no en cada push a main: cada subida gasta un versionCode y sale a
# produccion. Se etiqueta cuando se quiere publicar (store/ci.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Canal de Play
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      status:
        description: draft sube la version sin publicarla, para revisarla o probarla antes en la consola
        type: choice
        options: [completed, draft]
        default: completed

# Lo unico que estos trabajos necesitan de GitHub es leer el codigo; las credenciales de Play van
# como secretos.
permissions:
  contents: read

jobs:
  release:
    # La secuencia entera vive en BaltaJmn/ci, igual que en las demas apps.
    uses: BaltaJmn/ci/.github/workflows/android-play-release.yml@main
    with:
      package-name: com.baltajmn.flowtime
      # La clave de subida se genero con CN=BaltaJmn, como la de Chroma, y el valor por defecto
      # del workflow compartido es CN=Baltasar: sin esta linea la firma correcta se rechaza.
      signer-cn: CN=BaltaJmn
      gradle-tasks: ':app:bundleRelease'
      aab-path: app/build/outputs/bundle/release/app-release.aab
      # Esta app ya esta en produccion, asi que la etiqueta publica ahi y no en alpha.
      track: ${{ inputs.track || 'production' }}
      status: ${{ inputs.status || 'completed' }}
      whatsnew-dir: store/whatsnew
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
