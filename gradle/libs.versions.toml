[versions]
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
kotlin = "2.1.20"
gradle = "8.13.2"
ktlint = "11.5.1"
room = "2.7.1"
composeCompiler = "1.5.4"
composeBom = "2025.06.00"
junit = "4.13.2"
testJunit = "1.2.1"
