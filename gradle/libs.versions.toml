mock = "1.12.3"
testEspresso = "3.6.1"
lifecycle = "2.9.1"
koinCore = "3.5.6"
koinCompose = "3.5.6"
gson = "2.11.0"
coroutines-test = "1.7.3"
lottieCompose = "6.0.0"
