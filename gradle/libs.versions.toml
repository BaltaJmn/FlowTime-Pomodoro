[versions]
compileSdk = "36"
targetSdk = "36"
minSdk = "26"
kotlin = "2.4.10"
gradle = "9.0.1"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
room = "2.8.5"
# La de Room 2.8.5. En el iPhone, Room va con su propio SQLite (sqlite-bundled).
sqlite = "2.6.2"
kotlinxDatetime = "0.8.0"
# Compose Multiplatform (#61), como HabitTracker. La 1.12 pide compileSdk 37, que AGP 9.0 aun no
# recomienda. Su Material3 va aparte y en Android trae androidx.compose.material3 1.5.0-alpha17.
composeMultiplatform = "1.11.1"
jbMaterial3 = "1.11.0-alpha07"
jbMaterialIcons = "1.7.3"
# La 2.11 ya pide compileSdk 37 y AGP 9.1.
jbLifecycle = "2.10.0"
# La 2.3 ya pide Compose Multiplatform 1.12.
compottie = "2.2.4"
composeBom = "2026.06.01"
junit = "4.13.2"
testJunit = "1.2.1"
testJunitJupiter = "5.8.2"
mock = "1.14.11"
testEspresso = "3.6.1"
lifecycle = "2.9.1"
koinCore = "3.5.6"
koinCompose = "3.5.6"
gson = "2.11.0"
coroutines-test = "1.11.0"
lottieCompose = "6.0.0"
core-ktx = "1.16.0"
appcompat = "1.7.1"
material = "1.12.0"
ksp = "2.3.12"
material3 = "1.3.2"
turbine = "1.2.0"
playPublisher = "3.8.6"
revenuecat = "10.23.4"
foundationLayoutAndroid = "1.8.2"
reviewKtx = "2.0.2"
kotlinImmutable = "0.3.6"
materialKolor = "2.1.1"
kotlinxSerialization = "1.11.0"
robolectric = "4.16"
roborazzi = "1.60.0"
glance = "1.1.1"

[libraries]

androidx-compose-activity = "androidx.activity:activity-compose:1.10.1"
androidx-compose-navigation = "androidx.navigation:navigation-compose:2.9.0"
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-testManifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling-debug = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
kotlin-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinImmutable" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }



androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koinCore" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinCore" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koinCompose" }


compose-lottie = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }

play-publisher = { module = "com.github.triplet.gradle:play-publisher", version.ref = "playPublisher" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
cmp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
cmp-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jbMaterial3" }
cmp-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "jbMaterialIcons" }
cmp-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jbLifecycle" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }

junit = { module = "junit:junit", version.ref = "junit" }
junit-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "testJunitJupiter" }
junit-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "testEspresso" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }
mock = { module = "io.mockk:mockk", version.ref = "mock" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

plugin-android = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
plugin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
plugin-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
plugin-kotlin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
plugin-room = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
plugin-compose-multiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "reviewKtx" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
# Trae su propia Play Billing (la 8.3.0 en la 10.23.x), así que no va aparte.
revenuecat = { module = "com.revenuecat.purchases:purchases", version.ref = "revenuecat" }
androidx-foundation-layout-android = { group = "androidx.compose.foundation", name = "foundation-layout-android", version.ref = "foundationLayoutAndroid" }

[plugins]

roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

[bundles]

unitTest = ["junit", "junit-junit", "coroutines-test"]
instrumentationTest = ["junit", "junit-junit", "junit-espresso"]